<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gaming Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background-color: #fbd5e0;
      color: white;
    }

    .dashboard {
      display: flex;
      height: 100vh;
      width: 100%;
    }

    .sidebar, .friends {
      background-color: #2c0a1a;
      width: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0;
    }

    .sidebar img,
    .friends img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin: 10px 0;
    }

    .main {
      flex: 1;
      background-color: #4d0f2a;
      padding: 30px;
      border-radius: 30px 0 0 30px;
      overflow-y: auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header input {
      padding: 8px 16px;
      border-radius: 20px;
      border: none;
      background: #2c0a1a;
      color: white;
    }

    .featured {
      background-color: #f25c66;
      border-radius: 20px;
      padding: 20px;
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .featured-info {
      max-width: 60%;
    }

    .badge {
      background-color: #ffd93d;
      color: black;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 10px;
    }

    .section {
      margin-top: 40px;
    }

    .section h2 {
      margin-bottom: 10px;
    }

    .games {
      display: flex;
      gap: 20px;
    }

    .game-card {
      background-color: #1f1f1f;
      width: 150px;
      height: 200px;
      border-radius: 16px;
      padding: 10px;
    }

    .download-card {
      background-color: #8b1e3f;
      padding: 20px;
      border-radius: 20px;
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stats-card {
      background-color: #3f0f2e;
      padding: 20px;
      border-radius: 20px;
      margin-top: 10px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
    }

    .stat {
      text-align: center;
    }

    .profile-pic {
      background: #ddd;
      border-radius: 50%;
      width: 40px;
      height: 40px;
    }
  </style>
</head>
<body>
  <div class="dashboard">
    
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="profile-pic"></div>
      <img src="#" alt="icon" />
      <img src="#" alt="icon" />
      <img src="#" alt="icon" />
      <div style="margin-top: auto;">
        <button style="width: 40px; height: 40px; background: red; border-radius: 50%; border: none;">+</button>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main">
      <div class="header">
        <h1>Good evening, <strong>NIKITIN</strong></h1>
        <input type="text" placeholder="Search">
      </div>

      <div class="featured">
        <div class="featured-info">
          <span class="badge">Popular</span>
          <h2>Valorant</h2>
          <p>A multiplayer computer game developed and published by Riot Games.</p>
          <button style="margin-top: 10px; padding: 6px 12px; border: none; border-radius: 8px; background: white; color: black;">+53 Reviews</button>
        </div>
        <div style="width: 120px; height: 120px; background: #ccc; border-radius: 12px;"></div>
      </div>

      <div class="section">
        <h2>New Games</h2>
        <div class="games">
          <div class="game-card">Uncharted 4</div>
          <div class="game-card">Dishonored</div>
        </div>
      </div>

      <div class="section">
        <h2>Last Downloads</h2>
        <div class="download-card">
          <div>
            <strong>FIFA 23</strong><br>
            <small>Sports Simulator</small>
          </div>
          <div style="text-align: right;">
            <small>1 hour 23 min.</small><br>
            <small>265MB of 1.23GB</small>
          </div>
        </div>
      </div>

      <div class="section">
        <h2>Your Statistic</h2>
        <div class="stats-card">
          <p>Total hours</p>
          <h2>12,340h</h2>
          <div class="stat-row">
            <div class="stat">
              <strong>2,340h</strong><br>
              Dota
            </div>
            <div class="stat">
              <strong>5,420h</strong><br>
              CS:GO
            </div>
            <div class="stat">
              <strong>4,580h</strong><br>
              LoL
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Friends List -->
    <div class="friends">
      <img src="#" alt="friend" />
      <img src="#" alt="friend" />
      <img src="#" alt="friend" />
      <img src="#" alt="friend" />
    </div>
  </div>
</body>
</html>
